{{- $logo := .Get "logo" -}}
{{- $degree := .Get "degree" -}}
<div style="display:flex;gap:1.25rem;align-items:flex-start;margin:1.25rem 0 1.5rem;">
  <div style="flex-shrink:0;width:110px;padding-top:.15rem;padding-left:10px;display:flex;align-items:flex-start;justify-content:flex-start;">
    {{- if $logo -}}
    <img src="{{ $logo }}" alt="" loading="lazy"
      style="max-width:110px;max-height:68px;width:auto;height:auto;object-fit:contain;object-position:left top;" />
    {{- end -}}
  </div>
  <div style="flex:1;min-width:0;">
    <div style="font-weight:700;margin-bottom:.2rem;">{{ $degree }}</div>
    {{ .Inner | markdownify }}
  </div>
</div>
