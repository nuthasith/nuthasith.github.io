{{- define "title" -}}Visitor Map | {{ .Site.Title }}{{- end -}}
{{- define "content" -}}
<div class="page single">
    <div class="content" id="content">
        <h1 class="single-title animated flipInX">Visitor Map</h1>
        <p style="opacity: 0.65; margin-bottom: 1.5rem;">
            Where in the world are visitors coming from? Tracked cookie-free.
        </p>

        <div id="chartdiv" style="width: 100%; height: 480px;"></div>
        <div id="visitor-table" style="margin-top: 2rem;"></div>
    </div>
</div>

<script src="https://cdn.amcharts.com/lib/5/index.js"></script>
<script src="https://cdn.amcharts.com/lib/5/map.js"></script>
<script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>
<script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

<script>
(async function () {
    var workerURL = '{{ .Site.Params.visitorWorkerURL }}';
    if (!workerURL) {
        document.getElementById('chartdiv').innerHTML =
            '<p style="padding:2rem;opacity:0.5">Visitor tracking not configured yet.</p>';
        return;
    }

    var counts = {};
    try {
        var res = await fetch(workerURL + '/stats');
        if (!res.ok) throw new Error();
        counts = await res.json();
    } catch (e) {
        document.getElementById('chartdiv').innerHTML =
            '<p style="padding:2rem;opacity:0.5">Could not load visitor data.</p>';
        return;
    }

    var isDark = document.body.getAttribute('theme') === 'dark';

    // Build code→name map from amCharts geodata (no separate lookup needed)
    var codeToName = {};
    am5geodata_worldLow.features.forEach(function (f) {
        if (f.id) codeToName[f.id] = f.properties.name;
    });

    var mapData = Object.keys(counts).map(function (code) {
        var id = code.toUpperCase();
        return { id: id, value: counts[code], name: codeToName[id] || id };
    });

    var root = am5.Root.new('chartdiv');
    root.setThemes([am5themes_Animated.new(root)]);

    var chart = root.container.children.push(am5map.MapChart.new(root, {
        panX: 'translateX',
        panY: 'translateY',
        projection: am5map.geoMercator(),
        paddingTop: 10,
        paddingBottom: 10,
    }));

    var polygonSeries = chart.series.push(am5map.MapPolygonSeries.new(root, {
        geoJSON: am5geodata_worldLow,
        valueField: 'value',
        calculateAggregates: true,
    }));

    polygonSeries.mapPolygons.template.setAll({
        tooltipText: '{name}: {value} visitors',
        interactive: true,
        fill: am5.color(isDark ? 0x363c47 : 0xe8eef4),
        stroke: am5.color(isDark ? 0x292a2d : 0xf0f0f0),
        strokeWidth: 0.5,
    });

    polygonSeries.mapPolygons.template.states.create('hover', {
        fill: am5.color(isDark ? 0x55bde2 : 0x2d96bd),
    });

    polygonSeries.set('heatRules', [{
        target: polygonSeries.mapPolygons.template,
        dataField: 'value',
        min: am5.color(isDark ? 0x1e4060 : 0xaad0ee),
        max: am5.color(isDark ? 0x55bde2 : 0x1a6bbf),
        key: 'fill',
    }]);

    polygonSeries.data.setAll(mapData);

    // Pin series — small balloon with number, pointy bottom anchored at country centroid
    var pinSeries = chart.series.push(am5map.MapPointSeries.new(root, {
        polygonIdField: 'id',
    }));

    pinSeries.bullets.push(function (root, series, dataItem) {
        var r = 12;
        var stemH = 8;
        var pinColor = am5.color(isDark ? 0x55bde2 : 0x2d96bd);
        var strokeColor = am5.color(isDark ? 0x1a1a1a : 0xffffff);

        var container = am5.Container.new(root, {
            width: r * 2,
            height: r * 2 + stemH,
            centerX: am5.p50,
            centerY: am5.percent(100),
            tooltipText: '{name}: {value} visitors',
        });

        // Balloon circle
        container.children.push(am5.Circle.new(root, {
            radius: r,
            x: r,
            y: r,
            centerX: am5.p50,
            centerY: am5.p50,
            fill: pinColor,
            stroke: strokeColor,
            strokeWidth: 1.5,
        }));

        // Pointy stem
        container.children.push(am5.Graphics.new(root, {
            svgPath: 'M -5 0 L 5 0 L 0 ' + stemH + ' Z',
            fill: pinColor,
            x: r,
            y: r * 2 - 2,
            centerX: am5.p50,
        }));

        // Number label
        container.children.push(am5.Label.new(root, {
            text: '{value}',
            populateText: true,
            fill: am5.color(0xffffff),
            x: r,
            y: r,
            centerX: am5.p50,
            centerY: am5.p50,
            fontSize: 10,
            fontWeight: '700',
        }));

        return am5.Bullet.new(root, { sprite: container });
    });

    pinSeries.data.setAll(mapData);
    chart.appear(1000, 100);

    // Country table — sorted by visit count
    var sorted = Object.keys(counts)
        .map(function (code) {
            var id = code.toUpperCase();
            return { name: codeToName[id] || id, count: counts[code] };
        })
        .sort(function (a, b) { return b.count - a.count; });

    var total = sorted.reduce(function (s, r) { return s + r.count; }, 0);

    document.getElementById('visitor-table').innerHTML =
        '<h3>' + total + ' visitors from ' + sorted.length + ' countries</h3>' +
        '<table class="gc-table"><thead><tr><th>Country</th><th>Visitors</th></tr></thead><tbody>' +
        sorted.map(function (r) {
            return '<tr><td>' + r.name + '</td><td>' + r.count + '</td></tr>';
        }).join('') +
        '</tbody></table>';
})();
</script>

<style>
.gc-table {
    width: 100%;
    max-width: 480px;
    border-collapse: collapse;
    font-size: 0.9rem;
    margin-top: 0.75rem;
}
.gc-table th,
.gc-table td {
    padding: 0.45rem 1rem;
    text-align: left;
    border-bottom: 1px solid #f0f0f0;
}
[theme=dark] .gc-table th,
[theme=dark] .gc-table td {
    border-bottom-color: #363636;
}
.gc-table th {
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0.55;
}
.gc-table tr:last-child td {
    border-bottom: none;
}
</style>
{{- end -}}
